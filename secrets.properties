# Hypixel Skyblock Timer — API key config
#
# 1. Get a free key at https://developer.hypixel.net/
# 2. Replace PASTE_YOUR_HYPIXEL_API_KEY_HERE below with your key
# 3. Save this file and put it in the SAME FOLDER as HypixelTimerApp.jar
#
# Without a valid key, the app will still open but cannot fetch
# forge, Kat, or Bazaar data from the Hypixel API.

hypixel.api.key=PASTE_YOUR_HYPIXEL_API_KEY_HERE